name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma client
        run: npx prisma generate
        
      - name: Build application
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret-key-for-preview
          NEXTAUTH_URL: https://preview-${{ github.event.number }}.vercel.app
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mpesa_rent_crm_preview
          
      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-team-id: ${{ secrets.VERCEL_TEAM_ID }}
          alias-domains: preview-${{ github.event.number }}.vercel.app
          
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployment } = await github.rest.repos.getDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deploy.outputs.deployment-id }}
            });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Deployment Ready! 
              
              **Preview URL**: ${deployment.url}
              
              **Environment**: Preview
              **Commit**: ${context.sha.substring(0, 7)}
              
              Please review the changes and test the preview deployment.`
            });
            
      - name: Run E2E tests on preview
        run: |
          npx playwright test --project=chromium
        env:
          BASE_URL: https://preview-${{ github.event.number }}.vercel.app
          
      - name: Update PR status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://preview-${{ github.event.number }}.vercel.app',
              description: 'Preview deployment successful',
              context: 'preview/deploy'
            });
